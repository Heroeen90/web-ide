name: Build Android APK (Vite + React)

on:
  push:
    branches:
      - main 

jobs:
  build:
    name: Build APK using Vite and Cordova
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # بناء مشروع React
      - name: Install Dependencies and Build Vite
        run: |
          npm install
          npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      # إنشاء الأندرويد، نسخ الملفات، وحقن الأيقونة
      - name: Build Cordova Project
        run: |
          cordova create app com.roeen.webide WebIDE
          rm -rf app/www/*
          rsync -av dist/ app/www/
          
          # نسخ الأيقونة من المجلد الرئيسي إلى مجلد تطبيق كوردوفا
          cp icon.png app/
          
          # حقن سطر الأيقونة داخل ملف إعدادات التطبيق config.xml
          sed -i 's/<\/widget>/    <icon src="icon.png" \/>\n<\/widget>/' app/config.xml
          
          cd app
          cordova platform add android
          cordova build android

      # رفع ملف الـ APK النهائي للتحميل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebIDE-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
